name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct portfolio source
        shell: bash
        run: |
          cat package/part-* | base64 --decode > portfolio.zip
          mkdir -p source
          unzip -q portfolio.zip -d source
          sed -i '1i using System.ComponentModel.DataAnnotations;' source/MuzammilPortfolio/Models/PortfolioModels.cs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish source/MuzammilPortfolio/MuzammilPortfolio.csproj -c Release -o publish

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i 's|<base href="/" />|<base href="/htmltesting/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
